<!doctype html><meta charset=utf-8><title>p6 trace vs source (300%)</title><style>body{font:14px sans-serif;background:#fff}.r{display:flex;gap:16px}.p{flex:1;overflow:auto;height:80vh;border:1px solid #888;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/20px 20px}img{width:2460px;display:block}</style><h1>Trace vs source at 300%: left source PNG, right traced SVG (scroll together)</h1><h2>alice</h2><div class=r><div class=p><img src='../alice_p6_layers_v0/alice.png'></div><div class=p><img src='alice.svg'></div></div><h2>curtain</h2><div class=r><div class=p><img src='../alice_p6_layers_v0/curtain.png'></div><div class=p><img src='curtain.svg'></div></div><script>document.querySelectorAll('.r').forEach(r=>{const[a,b]=r.children;let l=0;const s=(x,y)=>()=>{if(l)return;l=1;y.scrollLeft=x.scrollLeft;y.scrollTop=x.scrollTop;l=0};a.onscroll=s(a,b);b.onscroll=s(b,a);addEventListener('load',()=>{a.scrollLeft=(a.scrollWidth-a.clientWidth)/2;a.scrollTop=(a.scrollHeight-a.clientHeight)/2})})</script>
