name: E2E mpt-cairn-blackboard (configure, test, clean up)

# MPC-8413 step 5. MANUAL ONLY (workflow_dispatch). Does four things, never printing a secret:
#   1. Copies two repo secrets onto the Worker, so nobody has to paste a key anywhere:
#        NEW_SUPABASE_SECRET_KEY (or SUPABASE_KEY)         ->  SUPABASE_SERVICE_ROLE_KEY
#        NOTION_CAIRN_TOKEN, else NOTION_TOKEN (see below)  ->  NOTION_TOKEN
#   2. Issues a ONE-TIME bridge token (random, masked, known only to this job) and sets it as CAIRN_BRIDGE_TOKEN.
#   3. Runs workers/mpt-cairn-blackboard/e2e.mjs: a clearly marked test session through the real Worker, Supabase and Notion, checking the
#      phone hash, the masked seed email and the mirror, then deleting everything it created.
#   4. Deletes the one-time token again, so the Worker goes back to refusing every write until a real token is set.
#
# Which Notion token. PREFERRED: a dedicated integration that can see only the three Cairn databases, stored as the repo secret
# NOTION_CAIRN_TOKEN (Notion -> Settings -> Connections -> Develop or manage integrations -> New integration "mpt-cairn-sync", then its
# Access tab -> Edit access -> tick the three Cairn databases; GitHub -> Settings -> Secrets -> Actions -> NOTION_CAIRN_TOKEN).
# FALLBACK, used when NOTION_CAIRN_TOKEN is not set: the existing repo secret NOTION_TOKEN, which is the "mpt-leads-worker" integration.
# That integration can also read the MPT Leads database, and the fallback puts its token on the Cairn Worker, so treat it as a stop-gap and
# move to a dedicated integration later. In both cases the integration must be connected to the three Cairn databases under
# "14 - Data & Knowledge" (Cairn Live Investigations, Cairn Facts, Cairn Intent Queue): database ... menu -> Connections -> add it.
# A Notion canary below checks this BEFORE any Worker secret is changed and names the integration if a database is missing.
# Needs Worker secrets SUPABASE_URL and CAIRN_HASH_PEPPER to be set already (they are; this workflow does not touch them).
#
# Repo secrets used: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NEW_SUPABASE_SECRET_KEY or SUPABASE_KEY, and NOTION_CAIRN_TOKEN or NOTION_TOKEN.

on:
  workflow_dispatch:
    inputs:
      overwrite_token:
        description: 'true = allow replacing an existing CAIRN_BRIDGE_TOKEN. The test token is deleted at the end, so the Worker is left WITHOUT a bridge token.'
        required: false
        default: 'false'

concurrency:
  group: e2e-mpt-cairn-blackboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://xmdmkumwxpgahmlweuug.supabase.co
      BRIDGE_URL: https://mpt-cairn-blackboard.myprivacytool.workers.dev
      NOTION_CAIRN_SESSIONS_DB: 318dfa5f-eb62-46fa-9bd0-c9fa58577c65
      NOTION_CAIRN_FACTS_DB: 5aa01b41-879e-43f7-ac77-57bbb9bfcb77
      NOTION_CAIRN_INTENTS_DB: 3cdbc13a-85fe-4fea-b108-bbcf955227e4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the repo secrets this needs are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_KEY: ${{ secrets.NEW_SUPABASE_SECRET_KEY || secrets.SUPABASE_KEY }}
          NOTION_TOKEN_TO_USE: ${{ secrets.NOTION_CAIRN_TOKEN || secrets.NOTION_TOKEN }}
          HAS_DEDICATED: ${{ secrets.NOTION_CAIRN_TOKEN != '' }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SUPABASE_KEY" ] || missing="$missing NEW_SUPABASE_SECRET_KEY/SUPABASE_KEY"
          [ -n "$NOTION_TOKEN_TO_USE" ] || missing="$missing NOTION_CAIRN_TOKEN/NOTION_TOKEN"
          if [ -n "$missing" ]; then echo "::error::missing repo secrets:$missing"; exit 1; fi
          if [ "$HAS_DEDICATED" != "true" ]; then
            echo "::warning::NOTION_CAIRN_TOKEN is not set, so the existing NOTION_TOKEN (the mpt-leads-worker integration) is being used and copied onto the Cairn Worker. It can also read the MPT Leads database. Create a dedicated integration and set NOTION_CAIRN_TOKEN when you can; see the top of this workflow file."
          fi
          echo "all required repo secrets are present"

      - name: Canary - the Supabase key must read the database (apikey header only, as the Worker sends it)
        env:
          SUPABASE_KEY: ${{ secrets.NEW_SUPABASE_SECRET_KEY || secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/scans?select=id&limit=1")
          echo "canary HTTP $code"
          if [ "$code" != "200" ]; then echo "::error::the Supabase key did not read scans (HTTP $code); no Worker secret was changed"; exit 1; fi

      - name: Canary - the Notion token must open all three Cairn databases (before any Worker secret is changed)
        env:
          NOTION_TOKEN_TO_USE: ${{ secrets.NOTION_CAIRN_TOKEN || secrets.NOTION_TOKEN }}
        run: |
          who=$(curl -s -H "Authorization: Bearer $NOTION_TOKEN_TO_USE" -H 'Notion-Version: 2022-06-28' https://api.notion.com/v1/users/me | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("name") or d.get("message") or "unknown")')
          echo "Notion integration: $who"
          bad=0
          for db in "$NOTION_CAIRN_SESSIONS_DB" "$NOTION_CAIRN_FACTS_DB" "$NOTION_CAIRN_INTENTS_DB"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $NOTION_TOKEN_TO_USE" -H 'Notion-Version: 2022-06-28' "https://api.notion.com/v1/databases/$db")
            echo "database ${db:0:8}... HTTP $code"
            [ "$code" = "200" ] || bad=1
          done
          if [ "$bad" != "0" ]; then echo "::error::the Notion integration \"$who\" cannot open all three Cairn databases; open each one in Notion, then ... menu -> Connections -> add \"$who\". No Worker secret was changed."; exit 1; fi

      - name: Look at the Worker's current secrets (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/mpt-cairn-blackboard/secrets
          OVERWRITE: ${{ inputs.overwrite_token }}
        run: |
          curl -sf --oauth2-bearer "$CLOUDFLARE_API_TOKEN" "$CF_API" \
            | python3 -c 'import sys,json;print("\n".join(sorted(x["name"] for x in json.load(sys.stdin)["result"])))' > /tmp/secret-names
          echo "secrets on the Worker now:"; cat /tmp/secret-names
          for n in SUPABASE_URL CAIRN_HASH_PEPPER; do
            grep -qx "$n" /tmp/secret-names || { echo "::error::the Worker has no $n secret; set it first"; exit 1; }
          done
          if grep -qx CAIRN_BRIDGE_TOKEN /tmp/secret-names && [ "$OVERWRITE" != "true" ]; then
            echo "::error::the Worker already has a CAIRN_BRIDGE_TOKEN. This test replaces it with a one-time token and then deletes it. Re-run with overwrite_token=true if that is what you want."
            exit 1
          fi

      - name: Copy the Supabase and Notion credentials onto the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/mpt-cairn-blackboard/secrets
          SUPABASE_KEY: ${{ secrets.NEW_SUPABASE_SECRET_KEY || secrets.SUPABASE_KEY }}
          NOTION_TOKEN_TO_USE: ${{ secrets.NOTION_CAIRN_TOKEN || secrets.NOTION_TOKEN }}
        run: |
          put() {
            jq -n --arg n "$1" --arg t "$2" '{name:$n,text:$t,type:"secret_text"}' \
              | curl -sf -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @- "$CF_API" > /dev/null \
              && echo "set $1" || { echo "::error::could not set $1"; exit 1; }
          }
          put SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_KEY"
          put NOTION_TOKEN "$NOTION_TOKEN_TO_USE"

      - name: Issue a one-time bridge token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/mpt-cairn-blackboard/secrets
        run: |
          tok=$(openssl rand -hex 32)
          echo "::add-mask::$tok"
          echo "CAIRN_TOKEN=$tok" >> "$GITHUB_ENV"
          jq -n --arg t "$tok" '{name:"CAIRN_BRIDGE_TOKEN",text:$t,type:"secret_text"}' \
            | curl -sf -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @- "$CF_API" > /dev/null \
            || { echo "::error::could not set the one-time token"; exit 1; }
          echo "set=true" >> "$GITHUB_OUTPUT"
          echo "one-time bridge token set (value not shown)"

      - name: Run the end-to-end test
        env:
          SUPABASE_KEY: ${{ secrets.NEW_SUPABASE_SECRET_KEY || secrets.SUPABASE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_CAIRN_TOKEN || secrets.NOTION_TOKEN }}
        run: node workers/mpt-cairn-blackboard/e2e.mjs

      - name: Remove the one-time bridge token
        if: always() && steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/mpt-cairn-blackboard/secrets
        run: |
          curl -sf -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/CAIRN_BRIDGE_TOKEN" > /dev/null \
            && echo "one-time bridge token deleted" \
            || { echo "::error::COULD NOT DELETE the one-time bridge token; delete CAIRN_BRIDGE_TOKEN on mpt-cairn-blackboard by hand"; exit 1; }

      - name: Final state of the Worker's secrets (names only)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/mpt-cairn-blackboard/secrets
        run: |
          curl -sf --oauth2-bearer "$CLOUDFLARE_API_TOKEN" "$CF_API" \
            | python3 -c 'import sys,json;print("\n".join(sorted(x["name"] for x in json.load(sys.stdin)["result"])))' | tee /tmp/final-names
          { echo "### Secrets on mpt-cairn-blackboard now (names only)"; sed 's/^/- /' /tmp/final-names; echo; echo "Still needed from a person: **CAIRN_BRIDGE_TOKEN** (a real one, known to whoever configures Cairn)."; } >> "$GITHUB_STEP_SUMMARY"
