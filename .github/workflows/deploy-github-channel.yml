name: GitHub channel Worker

# MPC-115: tests run on every PR/push that touches the Worker.
# MPC-10825 follow-up: the Worker now DEPLOYS ON MERGE to main (and by hand, workflow_dispatch), like deploy-mpt-leads and
# deploy-oauth-poc. Before this, a merged Worker change never shipped until someone ran the workflow by hand, so the site and
# the Worker drifted apart. Safety, in order: tests; pre-deploy config check (repo secrets set, no REPLACE_*, EXPECTED_SECRETS.txt
# holds names only); snapshot of the Worker's secret NAMES; deploy; FAIL if any secret name changed or an expected one is missing;
# smoke-test the live Worker (scripts/ci/smoke-test.mjs github-channel: GET-only, no sign-in is completed) and auto-roll back if
# that fails. The job still ends red after a rollback so the incident is visible. See docs/ci-cd-testing.md#rollback.
# Secret VALUES (EXPECTED_SECRETS.txt) are only ever set by a human: `wrangler secret put`.
#
# Database changes are NOT deployed here. A Worker that reads or writes a new column needs its migration applied first
# (deploy-supabase.yml is manual); check that before merging a Worker change (see docs/channels/github.md, "Deploying").

on:
  push:
    branches: [main]
    paths:
      - 'workers/github-channel/**'
      - '.github/workflows/deploy-github-channel.yml'
      - 'scripts/ci/smoke-test.mjs'
      - 'shared/recipients/**'   # MPC-9885: the Workers bundle the recipient wrapper, so a change to it must redeploy them
  pull_request:
    paths:
      - 'workers/github-channel/**'
      - '.github/workflows/deploy-github-channel.yml'
      - 'scripts/ci/smoke-test.mjs'
  workflow_dispatch:

concurrency:
  group: github-channel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Worker (mocked GitHub, Supabase and KV)
        run: node --test workers/github-channel/test/*.test.mjs

  deploy:
    needs: test
    # Never on a pull request. On push the `on.push` filter already limits this to main; the ref check is belt and braces.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails BEFORE anything ships if repo secrets are missing, wrangler.toml still has REPLACE_* placeholders,
      # or EXPECTED_SECRETS.txt holds anything but secret NAMES.
      - name: Pre-deployment checks (secrets present, Worker config valid)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/check-env.mjs --require CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID --worker workers/github-channel

      - name: Snapshot secret names before deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sf --oauth2-bearer "$CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/myprivacytool-github-channel/secrets" \
            | python3 -c 'import sys,json;print("\n".join(sorted(x["name"] for x in json.load(sys.stdin)["result"])))' > /tmp/secrets.before
          echo "secret names before:"; cat /tmp/secrets.before

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        # The action runs `npm i wrangler@3.90.0` from the repo's npm workspace; a peer-dependency conflict from the
        # core-brain workspace (wrangler 4 wants workers-types 5) fails with ERESOLVE and blocks the deploy (MPC-10825,
        # run 45349974199). Same fix as deploy-mpt-leads.yml and deploy-oauth-poc.yml.
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/github-channel
          command: deploy

      - name: Verify secrets survived the deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sf --oauth2-bearer "$CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/myprivacytool-github-channel/secrets" \
            | python3 -c 'import sys,json;print("\n".join(sorted(x["name"] for x in json.load(sys.stdin)["result"])))' > /tmp/secrets.after
          echo "secret names after:"; cat /tmp/secrets.after
          if ! diff -q /tmp/secrets.before /tmp/secrets.after >/dev/null; then echo "::error::secret names changed across deploy"; diff /tmp/secrets.before /tmp/secrets.after; exit 1; fi
          sort workers/github-channel/EXPECTED_SECRETS.txt > /tmp/secrets.expected
          missing=$(comm -13 /tmp/secrets.after /tmp/secrets.expected)
          [ -z "$missing" ] || { echo "::error::expected secrets missing: $missing"; exit 1; }
          echo "OK: all expected secrets present"

      # Post-deployment smoke test against the LIVE Worker (GET-only; a sign-in start only sets a 10-minute state cookie, and no
      # sign-in is ever completed). If it fails, roll back to the previous version and re-check; the job still ends red.
      - name: Smoke test live Worker
        id: smoke
        run: node scripts/ci/smoke-test.mjs github-channel --retries 4 --delay-ms 10000

      - name: Roll back to the previous Worker version (smoke test failed)
        if: failure() && steps.smoke.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/github-channel
          command: 'rollback --yes --message "auto-rollback, smoke test failed for ${{ github.sha }}"'

      - name: Re-run smoke test after rollback
        if: failure() && steps.smoke.outcome == 'failure'
        run: node scripts/ci/smoke-test.mjs github-channel --retries 3 --delay-ms 10000
