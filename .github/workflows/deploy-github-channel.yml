name: GitHub channel Worker

# MPC-115: tests run on every PR/push that touches the Worker. Deploy is MANUAL (workflow_dispatch) until
# the REPLACE_* values in workers/github-channel/wrangler.toml (OAuth client id, Supabase URL, KV id)
# are filled in; deploying with placeholders would fail. Same secret-name safety checks as deploy-oauth-poc.yml.
# Secret VALUES (EXPECTED_SECRETS.txt) are only ever set by a human: `wrangler secret put`.

on:
  push:
    branches: [main]
    paths: ['workers/github-channel/**', '.github/workflows/deploy-github-channel.yml']
  pull_request:
    paths: ['workers/github-channel/**', '.github/workflows/deploy-github-channel.yml']
  workflow_dispatch:

concurrency:
  group: github-channel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Worker (mocked GitHub, Supabase and KV)
        run: node --test workers/github-channel/test/*.test.mjs

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to deploy placeholder config
        run: |
          if grep -q REPLACE_ workers/github-channel/wrangler.toml; then
            echo "::error::wrangler.toml still contains REPLACE_* placeholders"; exit 1; fi
      - name: Check required secrets are configured
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$T" ] && [ -n "$A" ] || { echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set"; exit 1; }
      - name: Snapshot secret names before deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s --oauth2-bearer "$CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/myprivacytool-github-channel/secrets" \
            | jq -r '(.result // [])[].name' 2>/dev/null | sort > /tmp/secrets.before || true
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/github-channel
          command: deploy
      - name: Verify secrets survived the deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sf --oauth2-bearer "$CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/myprivacytool-github-channel/secrets" \
            | jq -r '.result[].name' | sort > /tmp/secrets.after
          if ! diff -q /tmp/secrets.before /tmp/secrets.after >/dev/null; then echo "::error::secret names changed across deploy"; diff /tmp/secrets.before /tmp/secrets.after; exit 1; fi
          sort workers/github-channel/EXPECTED_SECRETS.txt > /tmp/secrets.expected
          missing=$(comm -13 /tmp/secrets.after /tmp/secrets.expected)
          if [ -n "$missing" ]; then echo "::warning::expected secrets not set yet: $missing"; else echo "OK: all expected secrets present"; fi
