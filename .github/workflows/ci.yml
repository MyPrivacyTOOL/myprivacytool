name: CI

# MPC-7300: every pull request (and every push to main) runs the full automated test suite.
#
# MERGE BLOCKING: the `CI gate` job at the bottom is the single required status check. In the repo settings
# (Settings -> Branches -> branch protection rule for `main`, or a Ruleset) tick "Require status checks to pass
# before merging" and select **CI gate** (plus "Require branches to be up to date"). That setting cannot be set
# from a workflow file; docs/ci-cd-testing.md has the exact steps. `CI gate` fails if ANY job below failed,
# was cancelled or was skipped, so a path-filter or a skipped job can never let a broken PR through.
#
# No secrets are used: all third-party calls are mocked (unit/E2E) or hit a throwaway Postgres (db job).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests + coverage (Vitest, Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vitest with coverage (fails below 80% lines/functions/statements on critical paths)
        run: npm run test:coverage
      - name: Existing node:test suites (github-channel, oauth-poc, mpt-leads, scan-report)
        run: npm run test:workers:node
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total;const r=k=>`${t[k].pct}% (${t[k].covered}/${t[k].total})`;console.log(`### Coverage (critical paths)\n\n| metric | covered |\n|---|---|\n| lines | ${r("lines")} |\n| statements | ${r("statements")} |\n| functions | ${r("functions")} |\n| branches | ${r("branches")} |`)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 14

  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret scan (blocking; prints file:line and pattern name only, never the value)
        run: npm run scan:secrets
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint test code (blocking)
        run: npm run lint:tests
      - name: Lint whole repo (informational until the existing backlog is cleared)
        # `main` already has ~20 pre-existing lint errors in untouched source files. Reported, not blocking;
        # new test code is held to zero errors by the step above. Remove continue-on-error once the backlog is fixed.
        continue-on-error: true
        run: npm run lint

  db:
    name: Supabase integration tests (throwaway Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema + run RLS/constraint tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/run.sh

  support-rest:
    # MPC-8528: the support case store over a REAL PostgREST on a throwaway Postgres (never a Supabase project).
    # The unit job runs the same test file with SUPPORT_REST_URL unset, where it skips itself.
    name: Support store over PostgREST (throwaway Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgres://postgres:postgres@localhost:5432/postgres
      # Throwaway values for this job only. Not a secret: the database and API live and die with the runner.
      SUPPORT_REST_JWT_SECRET: ci-throwaway-jwt-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bootstrap + the proposed support schema
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PGURL" -f supabase/tests/bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 "$PGURL" -f supabase/migrations/20261027140000_mpc_8528_support_cases.sql
          psql -X -v ON_ERROR_STOP=1 "$PGURL" -c "create role authenticator login noinherit password 'ci-auth'" -c "grant anon, authenticated, service_role to authenticator"
      - name: Start PostgREST
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="postgres://authenticator:ci-auth@localhost:5432/postgres" \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$SUPPORT_REST_JWT_SECRET" -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/ >/dev/null 2>&1 && { echo "PostgREST up"; exit 0; }
            sleep 2
          done
          docker logs postgrest | tail -30; echo "::error::PostgREST did not start"; exit 1
      - name: Run the store tests against it
        env:
          SUPPORT_REST_URL: http://localhost:3000
        run: npx vitest run shared/support/rest-store.integration.vitest.ts
      - name: PostgREST logs (on failure)
        if: failure()
        run: docker logs postgrest 2>&1 | tail -60

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (includes prerender-meta + sitemap postbuild)
        env:
          # Test-only GUID so the E2E suite exercises the real HubSpot submit path on /contact.
          VITE_HUBSPOT_CONTACT_FORM_ID: e2e-contact-form
          # MPC-7471-F3: production builds with saving on (MPC-7470), and e2e/popup-report.spec.ts needs the save tick box the popup then offers.
          VITE_SAVE_WEB_SCANS: "true"
          # CK-8494: the re-check journey is build-only and OFF in production; this CI build turns it on so e2e/recheck-trace.spec.ts can exercise it.
          VITE_RECHECK_JOURNEY: "true"
        run: npm run build
      - name: Verify build output
        run: |
          for f in dist/index.html dist/contact.html dist/start.html dist/sitemap.xml; do
            [ -s "$f" ] || { echo "::error::$f missing or empty"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  pages-functions:
    name: Pages Functions build (wrangler)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle functions/ the way Cloudflare Pages does
        # The site build (job `build`) never touches functions/. Cloudflare Pages bundles it on every deploy, and
        # one unresolvable import (for example a Node built-in such as "crypto" without nodejs_compat) fails the
        # whole Pages build, so no website deploy goes out until it is fixed. Offline: no credentials needed.
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler pages functions build functions --outdir "$RUNNER_TEMP/pages-functions"

  e2e:
    name: E2E (Playwright, desktop + mobile)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E against the production build
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  pipeline-guards:
    name: Deploy-safety script + workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run scripts
      - name: Worker configs are deployable (no placeholders, valid secret-name lists)
        run: |
          node scripts/ci/check-env.mjs --worker workers/mpt-leads --worker workers/oauth-poc --worker workers/scan-report --worker workers/mirror-risk --worker workers/partner-api

  ci-gate:
    name: CI gate
    if: always()
    needs: [unit, lint, db, support-rest, build, pages-functions, e2e, pipeline-guards]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null; then
            echo "All required jobs passed."
          else
            echo "::error::one or more required jobs did not succeed - merge blocked"; exit 1
          fi
