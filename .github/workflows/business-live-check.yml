name: Business team live check

# MPC-9824 (F6): one synthetic end-to-end run of business teams on the deployed system: an admin signs in, invites 3 employees, two authorise their own check (the fixture
# listing page), the admin summary covers those two only, one withdraws, the admin removes the third and deletes the team. Output: the job summary (JSON). On demand, and on a push
# to a `business-check/**` branch (the relay used when workflows cannot be dispatched from a coding session). F1 synthetic Worker by default (MPC-10612: a manual run can name the production Worker), testingnt69+biz-* aliases only, rows of the run removed. Keep mode (MPC-10612) keeps one invitation on purpose; clean mode removes it.

on:
  workflow_dispatch:
    inputs:
      scan_url:
        description: 'Worker to test. Empty = the F1 synthetic Worker. MPC-10612: https://mpt-scan-report.myprivacytool.workers.dev = production'
        required: false
        default: ''
      keep_mode:
        description: 'normal = the full check, everything removed at the end. keep = send ONE real invitation to a testingnt69+biz-keep alias, prove it (incl. 30-day expiry and a real browser opening the link) and KEEP it. clean = remove every kept invitation.'
        type: choice
        options: [normal, keep, clean]
        default: normal
  push:
    branches: ['business-check/**']

permissions:
  contents: read

concurrency:
  group: f1-live-check
  cancel-in-progress: false

jobs:
  check:
    name: Business team live check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://xmdmkumwxpgahmlweuug.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEW_SUPABASE_SECRET_KEY || secrets.SCAN_REPORT_SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.SCAN_REPORT_RESEND_API_KEY }}
      RUN_ID: ${{ github.run_id }}
      BUSINESS_SCAN_URL: ${{ inputs.scan_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the check
        if: ${{ inputs.keep_mode != 'keep' && inputs.keep_mode != 'clean' }}
        run: node scripts/business-live-check/run.mjs
      # MPC-10612: keep mode. The invitation it sends is NOT deleted, so a person can open the email and follow the link. It needs a browser for the page check.
      - name: Install the browser (keep mode only)
        if: ${{ inputs.keep_mode == 'keep' }}
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Send and keep one invitation, prove it, open the link in a real browser
        if: ${{ inputs.keep_mode == 'keep' }}
        run: node scripts/business-live-check/keep.mjs
      - name: Keep-mode screenshot
        if: ${{ always() && inputs.keep_mode == 'keep' }}
        uses: actions/upload-artifact@v4
        with:
          name: keep-invitation-evidence
          path: keep-evidence/
          if-no-files-found: ignore
      - name: Remove every kept invitation (clean mode)
        if: ${{ inputs.keep_mode == 'clean' }}
        run: CLEAN_KEPT=1 node scripts/business-live-check/keep.mjs
