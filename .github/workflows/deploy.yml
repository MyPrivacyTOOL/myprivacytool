name: Deploy core-brain & social-listeners

# MPT (MyPrivacyTOOL) MPT-1004. Microdrama: tests first, curtain up only on green.
# Push to main -> npm install + npm test -> deploy both Workers with wrangler-action@v3 and sync secrets.
#
# Repo secrets required (Settings -> Secrets and variables -> Actions): see /SECRETS.md
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   SUPABASE_URL, SUPABASE_KEY, QWEN_API_KEY, TWILIO_SID, TWILIO_AUTH_TOKEN, META_APP_SECRET

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-core-workers
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: [core-brain, social-listeners]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-deployment checks (Cloudflare credentials, Worker config)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/check-env.mjs --require CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID --worker workers/${{ matrix.worker }}

      - name: Deploy core-brain
        if: matrix.worker == 'core-brain'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/core-brain
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_KEY
            QWEN_API_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}

      - name: Deploy social-listeners
        if: matrix.worker == 'social-listeners'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/social-listeners
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_KEY
            TWILIO_SID
            TWILIO_AUTH_TOKEN
            META_APP_SECRET
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
