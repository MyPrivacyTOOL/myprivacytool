name: Triage opt-out / data-request check (Qwen, synthetic only)

# MPC-9783: runs the yes/no "does this ask us to stop contacting them, or about their personal data?" check over scripts/triage-eval/flag-set.json (200 SYNTHETIC messages) and scores recall.
# Manual only. Sends no real mail and reads no database. Needs repo secret QWEN_API_KEY (fails with a clear message if missing).

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Qwen model id'
        default: 'qwen-plus'

permissions:
  contents: read

jobs:
  flag:
    name: Score the yes/no check on the synthetic set
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the key
        run: |
          if [ -z "$QWEN_API_KEY" ]; then echo "::error::repo secret QWEN_API_KEY is not set; nothing was run"; exit 1; fi
      - name: Run the check on the synthetic messages
        run: node scripts/triage-eval/run-flag.mjs "$RUNNER_TEMP/flags.json"
      - name: Score
        if: ${{ !cancelled() }}
        run: node scripts/triage-eval/score-flag.mjs "$RUNNER_TEMP/flags.json"
      - name: Keep the answers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qwen-flags
          path: ${{ runner.temp }}/flags.json
          if-no-files-found: ignore
          retention-days: 14
