# TEMPORARY, read-only. Reads the Hexagon Registry's formula text and a few computed values to confirm the Confidence % change.
# Prints only: HTTP status, formula expressions of three columns, and 5 values for 3 rows. No secret and no other row data is printed.
# Remove this file after one run.
name: tmp-registry-formula-read

on:
  workflow_dispatch:
  push:
    branches: ['claude/ecstatic-mayer-lmc29y']
    paths: ['.github/workflows/tmp-registry-formula-read.yml']

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      T1: ${{ secrets.NOTION_TOKEN }}
      T2: ${{ secrets.NOTION_CAIRN_TOKEN }}
    steps:
      - name: Read registry formulas and values
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          DB = '40c28547eaa7810ba183cda4378d7597'
          V = '2022-06-28'
          def call(tok, method, path, body=None):
              req = urllib.request.Request('https://api.notion.com/v1' + path, method=method,
                  data=(json.dumps(body).encode() if body is not None else None),
                  headers={'Authorization': 'Bearer ' + tok, 'Notion-Version': V, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try: j = json.loads(e.read())
                  except Exception: j = {}
                  return e.code, {'code': j.get('code'), 'message': (j.get('message') or '')[:120]}
          worked = None
          for name in ('T1', 'T2'):
              tok = os.environ.get(name, '')
              label = {'T1': 'NOTION_TOKEN', 'T2': 'NOTION_CAIRN_TOKEN'}[name]
              if not tok:
                  print(label, 'not set'); continue
              s, j = call(tok, 'GET', '/databases/' + DB)
              print(label, 'GET database ->', s, ('' if s == 200 else j))
              if s == 200 and worked is None:
                  worked = (label, tok, j)
          if not worked:
              print('RESULT: neither token can see the registry database'); raise SystemExit(0)
          label, tok, db = worked
          print('USING', label)
          props = db.get('properties', {})
          for col in ('Confidence %', 'Source Count', 'Overlap Confidence %'):
              p = props.get(col, {})
              print('FORMULA', col, '=', (p.get('formula') or {}).get('expression'))
          rows = []; cur = None
          while True:
              body = {'page_size': 100}
              if cur: body['start_cursor'] = cur
              s, j = call(tok, 'POST', '/databases/' + DB + '/query', body)
              if s != 200: print('QUERY FAILED', s, j); raise SystemExit(0)
              rows += j['results']; cur = j.get('next_cursor')
              if not j.get('has_more'): break
          def txt(pr, c):
              return ''.join(x.get('plain_text', '') for x in (pr.get(c) or {}).get('rich_text', []))
          def sel(pr, c):
              return ((pr.get(c) or {}).get('select') or {}).get('name')
          def num(pr, c):
              return (pr.get(c) or {}).get('number')
          def fval(pr, c):
              f = (pr.get(c) or {}).get('formula') or {}
              return f.get(f.get('type'))
          R = []
          for r in rows:
              pr = r['properties']
              R.append({'id': int(num(pr, 'Hexagon ID') or 0), 'ch': sel(pr, 'Channel'), 'tech': txt(pr, 'Technical Field Name'), 'cat': sel(pr, 'Data Category'),
                        'gdpr': sel(pr, 'EU GDPR Status'), 'ds': [x['name'] for x in (pr.get('Data Sources') or {}).get('multi_select', [])],
                        'risk': sel(pr, 'Risk Score'), 'conf': fval(pr, 'Confidence %'), 'sc': fval(pr, 'Source Count'), 'oc': num(pr, 'Overlap Channels')})
          cnt = {}
          for r, x in zip(rows, R):
              x['url'] = r['url']; x['created'] = r.get('created_time'); x['title'] = ''.join(y.get('plain_text', '') for y in (r['properties'].get('Footprint') or {}).get('title', []))
              cnt[x['id']] = cnt.get(x['id'], 0) + 1
          print('TOTAL', len(R), 'distinct ids', len(cnt))
          dups = sorted(i for i, n in cnt.items() if n > 1)
          print('IDS WITH MORE THAN ONE ROW', dups)
          for x in sorted(R, key=lambda x: (x['id'], x['created'] or '')):
              if cnt[x['id']] > 1 or x['id'] == 0:
                  print('ROW id', x['id'], '|', x['title'][:45], '|', x['ch'], '|', x['created'], '|', x['ds'], '|', x['url'].split('/')[-1])
          EOF
