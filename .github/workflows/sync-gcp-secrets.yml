name: Sync GitHub secrets to GCP Secret Manager

# MPC-8379. Copies ANTHROPIC_API_KEY and the social tokens from GitHub Actions secrets into GCP Secret Manager
# (project avid-reference-480305-c3) as NEW versions, so nobody pastes keys into a terminal or a chat.
# Never prints a value: it logs secret NAMES, version numbers and character counts only.
#
# One-time prerequisite: the service account behind the GitHub secret GCP_SA_KEY needs
#   roles/secretmanager.secretVersionAdder   (it was created with secretAccessor + run.invoker only).
# Re-run any time a key is rotated: update the GitHub secret, then run this workflow.
#
# Required GitHub secrets: GCP_SA_KEY, ANTHROPIC_API_KEY,
#   X_API_KEY, X_API_SECRET, LINKEDIN_ACCESS_TOKEN, INSTAGRAM_ACCESS_TOKEN, FACEBOOK_ACCESS_TOKEN, PINTEREST_ACCESS_TOKEN
# MPT_SOCIAL_TOKENS is only written when ALL six are present, so a partial set never overwrites it.

on:
  workflow_dispatch:
  push:
    branches: [claude/charming-euler-tgc84w]
    paths: ['.github/workflows/sync-gcp-secrets.yml']

permissions:
  contents: read

env:
  PROJECT_ID: avid-reference-480305-c3

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Anthropic key -> ANTHROPIC_API_KEY
        env:
          VALUE: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$VALUE" ]; then echo "::error::GitHub secret ANTHROPIC_API_KEY is not set"; exit 1; fi
          printf '%s' "$VALUE" | gcloud secrets versions add ANTHROPIC_API_KEY --data-file=- --project="$PROJECT_ID"
          echo "ANTHROPIC_API_KEY: $(printf '%s' "$VALUE" | wc -c) characters written"

      - name: Social tokens -> MPT_SOCIAL_TOKENS (JSON)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          missing=""
          for n in X_API_KEY X_API_SECRET LINKEDIN_ACCESS_TOKEN INSTAGRAM_ACCESS_TOKEN FACEBOOK_ACCESS_TOKEN PINTEREST_ACCESS_TOKEN; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub secrets not set:$missing. MPT_SOCIAL_TOKENS was NOT changed."
            exit 1
          fi
          jq -n '{x_api_key: env.X_API_KEY, x_api_secret: env.X_API_SECRET, linkedin_access_token: env.LINKEDIN_ACCESS_TOKEN,
                  instagram_access_token: env.INSTAGRAM_ACCESS_TOKEN, facebook_access_token: env.FACEBOOK_ACCESS_TOKEN,
                  pinterest_access_token: env.PINTEREST_ACCESS_TOKEN}' \
            | gcloud secrets versions add MPT_SOCIAL_TOKENS --data-file=- --project="$PROJECT_ID"
          echo "MPT_SOCIAL_TOKENS: written with 6 keys"

      - name: Verify (names, states and sizes only)
        run: |
          for s in ANTHROPIC_API_KEY MPT_SOCIAL_TOKENS; do
            echo "== $s"
            gcloud secrets versions list "$s" --project="$PROJECT_ID" --limit=3 --format='table(name,state,createTime)'
            echo "latest size: $(gcloud secrets versions access latest --secret="$s" --project="$PROJECT_ID" | wc -c) characters"
          done
