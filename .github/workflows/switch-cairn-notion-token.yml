name: Switch Cairn Worker to the mpt-cairn-sync Notion token (MPC-8413)

# MANUAL ONLY. Sets exactly one Worker secret, NOTION_TOKEN on mpt-cairn-blackboard, from the repo secret NOTION_CAIRN_TOKEN (the dedicated
# mpt-cairn-sync integration; there is deliberately no fallback to the leads token). It first checks that the token opens all three Cairn
# databases, so the Worker is never switched to a token that cannot mirror. It does not touch CAIRN_BRIDGE_TOKEN or any other secret, and it
# never prints a secret value (names only).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switch-cairn-notion-token
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTION_CAIRN_SESSIONS_DB: 318dfa5f-eb62-46fa-9bd0-c9fa58577c65
      NOTION_CAIRN_FACTS_DB: 5aa01b41-879e-43f7-ac77-57bbb9bfcb77
      NOTION_CAIRN_INTENTS_DB: 3cdbc13a-85fe-4fea-b108-bbcf955227e4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NOTION_TOKEN_NEW: ${{ secrets.NOTION_CAIRN_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/mpt-cairn-blackboard/secrets
    steps:
      - name: Check the secrets this needs are present
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$NOTION_TOKEN_NEW" ] || missing="$missing NOTION_CAIRN_TOKEN"
          if [ -n "$missing" ]; then echo "::error::missing repo secrets:$missing"; exit 1; fi

      - name: Canary - the new Notion token must open all three Cairn databases
        run: |
          who=$(curl -s -H "Authorization: Bearer $NOTION_TOKEN_NEW" -H 'Notion-Version: 2022-06-28' https://api.notion.com/v1/users/me | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("name") or d.get("message") or "unknown")')
          echo "Notion integration: $who"
          bad=0
          for db in "$NOTION_CAIRN_SESSIONS_DB" "$NOTION_CAIRN_FACTS_DB" "$NOTION_CAIRN_INTENTS_DB"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $NOTION_TOKEN_NEW" -H 'Notion-Version: 2022-06-28' "https://api.notion.com/v1/databases/$db")
            echo "database ${db:0:8}... HTTP $code"
            [ "$code" = "200" ] || bad=1
          done
          if [ "$bad" != "0" ]; then echo "::error::\"$who\" cannot open all three Cairn databases; in Notion open each one, ... menu, Connections, add it. The Worker was not changed."; exit 1; fi

      - name: Set NOTION_TOKEN on the Worker (only that secret)
        run: |
          jq -n --arg t "$NOTION_TOKEN_NEW" '{name:"NOTION_TOKEN",text:$t,type:"secret_text"}' \
            | curl -sf -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @- "$CF_API" > /dev/null \
            && echo "set NOTION_TOKEN (value not shown)" || { echo "::error::could not set NOTION_TOKEN"; exit 1; }

      - name: Secrets on the Worker now (names only)
        run: |
          curl -sf --oauth2-bearer "$CLOUDFLARE_API_TOKEN" "$CF_API" \
            | python3 -c 'import sys,json;print("\n".join(sorted(x["name"] for x in json.load(sys.stdin)["result"])))' | tee /tmp/names
          { echo "### Secrets on mpt-cairn-blackboard (names only)"; sed 's/^/- /' /tmp/names; } >> "$GITHUB_STEP_SUMMARY"
