name: Triage eval (Qwen, synthetic only)

# MPC-9225: runs the 100 SYNTHETIC messages in scripts/triage-eval through Qwen and scores them. Manual only. Sends no real mail and reads no database.
# Needs repo secret QWEN_API_KEY (the same DashScope key core-brain uses). Without it the job fails with a clear message instead of passing.

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Qwen model id'
        default: 'qwen-plus'

permissions:
  contents: read

jobs:
  qwen:
    name: Score Qwen on the synthetic set
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the key
        run: |
          if [ -z "$QWEN_API_KEY" ]; then echo "::error::repo secret QWEN_API_KEY is not set; nothing was run"; exit 1; fi
      - name: Run Qwen on the synthetic messages
        run: node scripts/triage-eval/run-model.mjs "$RUNNER_TEMP/qwen.json"
      - name: Score
        run: node scripts/triage-eval/score.mjs "$RUNNER_TEMP/qwen.json"
