name: Sync content cache (Notion -> KV mpt-content-cache)

# Daily refresh of the Workstream 3 schedule + Brand Guidelines into Workers KV mpt-content-cache (script: scripts/sync-content-cache-to-kv.mjs),
# then the same page's per-day topics into mpt-brand-topics (script: scripts/sync-workstream-3-to-kv.mjs), which mpt-content-producer reads.
# 21:00 UTC = 05:00 HKT, one hour before the 06:00 HKT producer cron. Make.com can also trigger this via workflow_dispatch.
# Repo secrets: NOTION_TOKEN, CLOUDFLARE_API_TOKEN (needs Workers KV Storage > Edit), CLOUDFLARE_ACCOUNT_ID.

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: sync-content-cache
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pre-deployment checks (secrets present)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/check-env.mjs --require NOTION_TOKEN,CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID
      - name: Sync content cache (schedule + brand guidelines)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-content-cache-to-kv.mjs
      - name: Sync brand topics (mpt-brand-topics)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-workstream-3-to-kv.mjs
