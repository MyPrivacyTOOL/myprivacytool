name: Deploy oauth-poc Worker

# MPC-6960 / MPC-6971: the Google OAuth proof-of-concept Worker (workers/oauth-poc) deploys to the
# MyPrivacyTOOL Cloudflare account. MANUAL trigger only (Actions -> Deploy oauth-poc Worker -> Run workflow)
# so a public OAuth endpoint is never deployed by accident.
#
# Same repo secrets as deploy-mpt-leads.yml:
#   CLOUDFLARE_API_TOKEN   (MPT account, Workers Scripts > Edit)
#   CLOUDFLARE_ACCOUNT_ID  35cb17172c65a20f5cf1baf131485382
#
# Worker secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, STATE_SIGNING_KEY) are set by a human in the
# Cloudflare dashboard (Workers & Pages -> myprivacytool-oauth-poc -> Settings -> Variables and Secrets).
# `wrangler deploy` never touches secret values. The PoC is inert until they are set.
# After deploy this workflow only reports which expected secret NAMES are still missing; it does not fail
# on that, because the first deploy necessarily happens before the human sets them.

on:
  workflow_dispatch:

concurrency:
  group: deploy-oauth-poc
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secrets are configured
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$T" ] && [ -n "$A" ] || { echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set"; exit 1; }

      - name: Test Worker (mocked fetch)
        run: node --test workers/oauth-poc/oauth.test.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/oauth-poc
          command: deploy

      - name: Report which Worker secret names are still missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sf --oauth2-bearer "$CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/myprivacytool-oauth-poc/secrets" \
            | python3 -c 'import sys,json;print("\n".join(sorted(x["name"] for x in json.load(sys.stdin)["result"])))' > /tmp/secrets.after
          sort workers/oauth-poc/EXPECTED_SECRETS.txt > /tmp/secrets.expected
          missing=$(comm -13 /tmp/secrets.after /tmp/secrets.expected)
          if [ -n "$missing" ]; then echo "::warning::Worker secrets still to be set in the dashboard: $missing"; else echo "OK: all expected secrets present"; fi
