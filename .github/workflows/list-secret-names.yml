name: List secret names (names only)

# MPC-8379 helper. Prints the NAMES of secrets visible to this repo so the GCP sync can use the real ones.
# It never prints a value: only the keys of the secrets context are read, and values are masked by Actions anyway.
# Delete this file once the sync is wired.

on:
  workflow_dispatch:
  push:
    branches: [claude/charming-euler-tgc84w]
    paths: ['.github/workflows/list-secret-names.yml']

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Secret names
        env:
          ALL: ${{ toJSON(secrets) }}
        run: printf '%s' "$ALL" | jq -r 'keys[]' | sort
