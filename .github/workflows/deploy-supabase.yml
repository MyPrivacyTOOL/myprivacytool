name: Deploy Supabase migrations

# CK-006 (FLEET-TASK-V4.2): every merge to main runs `supabase db push` against the live MyPrivacyTOOL (MPT)
# Supabase project, so supabase/migrations/*.sql is the single source of schema truth.
#
# Repo secrets required (Settings -> Secrets and variables -> Actions); values are never printed:
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   the project's database password
#   SUPABASE_PROJECT_ID    project ref (xmdmkumwxpgahmlweuug)
#
# Safety: `db push --dry-run` logs the pending migrations first, so the job log shows exactly what will run.
# `db push` is a no-op when nothing is pending. Rollback notes live at the bottom of each migration file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-migrations
  cancel-in-progress: false

jobs:
  db-push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Until the three secrets exist, skip with a visible warning instead of failing every merge to main.
      # A manual run (workflow_dispatch) still fails hard so a missing secret cannot be ignored when deploying on purpose.
      - name: Check secrets
        id: secrets
        run: |
          if node scripts/ci/check-env.mjs --require SUPABASE_ACCESS_TOKEN,SUPABASE_DB_PASSWORD,SUPABASE_PROJECT_ID; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase migrations NOT deployed: repo secrets SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_ID are not set (CK-006)."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Pending migrations (dry run)
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
