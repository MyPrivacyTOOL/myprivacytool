name: Deploy Supabase migrations

# MPC-9896 (Pass 2): supabase/migrations now holds ONE baseline migration (the live structure, recorded as already applied on live)
# plus empty placeholder files for the older live versions; the old chain is in supabase/migrations_archive/ (not applied).
# See supabase/MIGRATIONS.md. Use dry_run=true first: it lists what is pending and applies nothing.
# MPC-9896: AUTOMATIC DEPLOY IS SWITCHED OFF. This workflow runs ONLY by manual dispatch with an explicit
# confirmation input (type DEPLOY). It never runs on push or merge. It is switched back on in Pass 2 of MPC-9896,
# after the clean baseline migration is in place (Option B decided by Chris 2026-11-17).
#
# CK-006 (FLEET-TASK-V4.2): `supabase db push` against the live MyPrivacyTOOL (MPT)
# Supabase project, so supabase/migrations/*.sql is the single source of schema truth.
#
# MPC-9896 (2026-11-27 19:56 HKT): the first dry run failed with the CLI's own message "--password only applies to a linked project ...
# To use the linked project instead, pass --remote", and `supabase link` says it ignores --password. The database password is read from the
# SUPABASE_DB_PASSWORD environment variable this job already sets, so --password is gone and db push now says --remote. If a later CLI release
# changes these flags again, the dry run fails at its own step before anything is applied; fix the flags here, do not pass --password again.
#
# MPC-9896-B (2026-11-28 14:03 HKT): the first real run (run 46114808949) stopped with "Confirmation required: Apply 2 migrations ... This run can't ask because
# stdout is not a terminal. Nothing was changed. Re-run with --yes". The current CLI asks for confirmation before it applies. The apply step passes --yes: it is
# already gated by confirm=DEPLOY and dry_run != 'true', and the dry run above has printed the exact list into the same job log.
#
# Repo secrets required (Settings -> Secrets and variables -> Actions); values are never printed:
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   the project's database password
#   SUPABASE_PROJECT_ID    project ref (xmdmkumwxpgahmlweuug)
#
# Safety: `db push --dry-run` logs the pending migrations first, so the job log shows exactly what will run.
# `db push` is a no-op when nothing is pending. Rollback notes live at the bottom of each migration file.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to apply pending migrations to the LIVE database'
        required: true
        type: string
      dry_run:
        description: 'true = only list the pending migrations (supabase db push --dry-run), apply nothing'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-supabase-migrations
  cancel-in-progress: false

jobs:
  db-push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmation input must be exactly DEPLOY. Nothing was run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Until the three secrets exist, skip with a visible warning instead of failing every merge to main.
      # A manual run (workflow_dispatch) still fails hard so a missing secret cannot be ignored when deploying on purpose.
      - name: Check secrets
        id: secrets
        run: |
          if node scripts/ci/check-env.mjs --require SUPABASE_ACCESS_TOKEN,SUPABASE_DB_PASSWORD,SUPABASE_PROJECT_ID; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Supabase migrations NOT applied::repo secrets SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_ID are not set (CK-006). This run is green but applied nothing: every migration in supabase/migrations must be applied to the live project by hand until the secrets exist (MPC-8689 found the footprint scope migration missing this way)."
            {
              echo "### Migrations were NOT applied"
              echo "The three repo secrets are not set, so this green run did not touch the live database. Apply new files in supabase/migrations by hand, or set the secrets."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Pending migrations (dry run)
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --dry-run --remote

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true' && inputs.dry_run != 'true'
        run: supabase db push --remote --yes
