name: Core Brain rate-limit probe

# MPC-7257: proves the live per-sender rate limit (10 requests / 60s, the 11th gets 429) against
# https://brain.myprivacytool.io on demand. Manual only: Actions -> "Core Brain rate-limit probe" -> Run workflow.
# Costs about 11 live Qwen calls per run, so it is deliberately NOT part of "Core Brain production gates".
# WEBHOOK_SECRET is read from the repo secret by this runner; it is never printed and never has to be handed to a
# person or an agent. Senders are synthetic (rl-probe-<time>). Output is limited to pass/fail and status codes.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Requests to send for the one sender (11 to 30). More requests tell an approximate limiter from a missing one."
        default: "15"

permissions:
  contents: read

concurrency:
  group: core-brain-rate-limit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core Brain rate-limit probe (429 on request 11)
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          COUNT: ${{ inputs.count }}
        run: node scripts/ci/core-brain-rate-limit-probe.mjs --count "${COUNT:-15}"
