name: supabase-schema-snapshot

# MPC-9896: manual, READ-ONLY snapshot of the live MPT Supabase project, saved as a build artifact:
#   (a) live schema, structure only (no table data)
#   (b) live list of applied migration versions and names (bookkeeping table only)
# Needs repo secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID. Values are masked, never printed.
# An authentication failure here means the secrets are not set or not valid.

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Label for the artifact (e.g. before, after)'
        required: false
        default: 'snapshot'
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-schema-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PGOPTIONS: '-c default_transaction_read_only=on'
    steps:
      - uses: actions/checkout@v4

      - name: Mask secrets and check they exist
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            val="${!v}"
            if [ -z "$val" ]; then echo "::error::secret $v is not set"; exit 1; fi
            echo "::add-mask::$val"
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project (read-only)
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Dump live schema (structure only, no data)
        run: |
          mkdir -p snapshot
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f snapshot/live_schema.sql
          if grep -qE '^COPY .* FROM stdin' snapshot/live_schema.sql; then echo "::error::dump contains table data"; exit 1; fi

      - name: List applied migrations (versions and names)
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$(cat supabase/.temp/pooler-url)" -At -F ' | ' \
            -c "select version, name from supabase_migrations.schema_migrations order by version" \
            > snapshot/live_applied_migrations.txt
          wc -l snapshot/live_applied_migrations.txt

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-${{ inputs.label }}-${{ github.run_id }}
          path: snapshot/
          retention-days: 90
