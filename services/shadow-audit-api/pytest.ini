[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    unit: unit tests (services)
    integration: integration tests (endpoints)
    slow: slow tests (network, file I/O)
    auth: authentication tests
    passport: passport credential tests
    audit: audit endpoint tests
    hexagon: hexagon framework tests

asyncio_mode = auto
