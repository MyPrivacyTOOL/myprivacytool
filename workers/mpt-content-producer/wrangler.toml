# mpt-content-producer: cron Worker that ONLY enqueues the daily content-generation job (no LLM call here, so no cron timeout).
# MyPrivacyTOOL Cloudflare account 35cb17172c65a20f5cf1baf131485382. Consumer: workers/mpt-content-consumer.
name = "mpt-content-producer"
main = "worker.js"
workers_dev = true
compatibility_date = "2024-09-23"

[observability]
enabled = true

# Cloudflare cron is UTC. 06:00 HKT = 22:00 UTC the previous day. The spec's literal "0 6 * * *" would run at 14:00 HKT.
# NOTE: the Free plan allows 5 cron triggers per account (error 10072). mpt-leads (1) + scan-report (1) + mpt-metrics-collector (2)
# already use 4 per the repo; this Worker takes the 5th. Check the dashboard (Workers > Triggers) before the first deploy.
[triggers]
crons = ["0 22 * * *"]

[[queues.producers]]
queue = "mpt-content-generation-queue"
binding = "CONTENT_QUEUE"

[[d1_databases]]
binding = "AGENT_LOGS"
database_name = "mpt-agent-logs"
database_id = "b9dc1a03-74be-45a0-85db-fb61d80825ac"

# Secrets: none needed.
