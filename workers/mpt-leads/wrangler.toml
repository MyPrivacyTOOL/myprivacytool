# mpt-leads — live lead-capture Worker (MyPrivacyTOOL Cloudflare account 35cb17172c65a20f5cf1baf131485382)
name = "mpt-leads"
main = "worker.js"
workers_dev = true

# DECISION: the LIVE worker has an EMPTY compatibility_date (oldest runtime behaviour). wrangler
# requires one, so the first Action deploy changes it. The code is plain fetch/formData/crypto and is
# covered by worker.test.mjs, but verify once with a real submission after the first Action deploy.
compatibility_date = "2024-09-23"

# Matches the live settings read on 2026-10-05 (logs on, invocation logs persisted).
[observability]
enabled = false

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1

# Secrets are NOT declared here (values live in Cloudflare; `wrangler deploy` leaves them alone).
# Expected names: EXPECTED_SECRETS.txt (the workflow fails if any goes missing).

# MPC-6677: the scan-report Worker owns the confirmation email (no duplicate senders).
# Declared here, not in the dashboard, because `wrangler deploy` replaces dashboard-set plain vars.
[vars]
CONFIRMATION_OWNER = "scan-report"

# MPC-7350: per-IP rate limit on the public POST endpoint (10 requests / 60s). The code fails open if
# this binding is missing, so deploying the code before the binding is safe.
# Syntax note: the deploy action installs wrangler 3.90.0, which ignores the newer [[ratelimits]] table (it only warns
# 'Unexpected fields'), so the binding must be declared as [[unsafe.bindings]] type = "ratelimit".
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "7350"
simple = { limit = 10, period = 60 }

# MPC-7500: retry sweep for leads whose Hunter enrichment failed (keeps B2B enrichment inside 5 minutes).
[triggers]
crons = ["*/5 * * * *"]
