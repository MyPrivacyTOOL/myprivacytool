<!doctype html>
<!-- Source for public/email/hex/*.png (the hexagon tiles used in the scan emails). Mirrors the site's Hexagon.tsx look:
     pointy-top path, deep-green outline, white-to-soft-green fill, emoji icon, check badge when found, spaced caps label.
     Render: chromium --headless --default-background-color=00000000 --force-device-scale-factor=2 --window-size=900,1040 --screenshot=sheet.png hexagon-tiles.html
     then crop each 220x250 cell (4 columns, found/empty pairs) and trim to the alpha bounding box. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;overflow:hidden}
.t{position:absolute;width:220px;height:250px;font-family:Inter,"Helvetica Neue",Arial,sans-serif}
.t svg{position:absolute;left:10px;top:10px;width:200px;height:200px;overflow:visible}
.ic{position:absolute;left:0;width:220px;top:52px;text-align:center;font-size:38px;line-height:44px;font-family:"Noto Color Emoji",sans-serif}
.lb{position:absolute;left:34px;width:152px;top:104px;text-align:center;font-size:11.5px;line-height:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
</style></head><body>
<script>
const CATS=[['broker','📇','Data broker profiles'],['search','🔍','Search engines & public records'],['social','💬','Social media exposure'],['email','✉️','Email & breaches'],['device','💻','Device & browser fingerprinting'],['network','🌐','Network & location'],['professional','💼','Professional & LinkedIn data'],['ai_threat','🤖','AI & emerging threats']];
const P='M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z';
let i=0;
for(const [key,emoji,label] of CATS){for(const found of [true,false]){
  const col=i%4,row=Math.floor(i/4);i++;
  const stroke=found?'#15803d':'#8fb99d',txt=found?'#15803d':'#5c8f6e',id='g'+i;
  document.body.insertAdjacentHTML('beforeend',`<div class="t" id="${key}-${found?'found':'empty'}" style="left:${col*220}px;top:${row*250}px">
  <svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="${found?'#dcf0e2':'#f1f8f3'}"/></linearGradient></defs>
  <path d="${P}" fill="url(#${id})" stroke="${stroke}" stroke-width="${found?3.4:2.6}" stroke-linejoin="miter"/>
  ${found?'<circle cx="82" cy="17" r="11" fill="#15803d" stroke="#fff" stroke-width="1.6"/><path d="M76.5 17.2 L80.6 21.3 L88 13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>':''}</svg>
  <div class="ic" style="${found?'':'opacity:.55'}">${emoji}</div><div class="lb" style="color:${txt}">${label}</div></div>`);
}}
</script></body></html>
