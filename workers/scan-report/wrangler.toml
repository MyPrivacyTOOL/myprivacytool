# MPC-6677: scan -> confirmation -> privacy report (normally minutes; 48h is the overdue deadline). One Worker owns both the confirmation
# email and the report (no duplicate senders). Deploy to the MyPrivacyTOOL Cloudflare account.
name = "mpt-scan-report"
main = "index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# Cron fallback + report runner: every 5 minutes. Each scan is due within 48h (report_due_at).
[triggers]
crons = ["*/5 * * * *"]

[vars]
SUPABASE_URL = "https://xmdmkumwxpgahmlweuug.supabase.co"
HUBSPOT_LEAD_SOURCE = "web_scan"
# MPC-7261 GO LIVE: empty = open to everyone (privacy pages live, Chris content sign-off 2026-10-07, email copy approved).
# Rollback: put the test addresses back (comma separated; gmail "+tag" ignored) and redeploy to restrict sends again.
RECIPIENT_ALLOWLIST = ""
# Free mode: send the report even without a HIBP key (breaches shown as "not yet checked" + self-check link).
# With HIBP_API_KEY set, breaches are checked for real. Set "false" to HOLD reports until HIBP works.
ALLOW_PARTIAL_REPORT = "true"

# MPC-7448: HK Spam day-10 "you are now protected" email. Two switches, both anything-but-"true" = off:
#  HK_SPAM_ENABLED     "false": the job does nothing at all (no database read, no email).
#  HK_SPAM_EMAILS_LIVE "false": test mode. Nothing goes to registrants and no row is marked sent; the job only sends sample emails
#                      (one per language that has someone due) to HK_SPAM_TEST_INBOXES (comma separated, a Worker secret/var, never real users).
# Real sending is switched on at Chris's sign-off (MPC-7545), after the scan go-live (MPC-7385). See docs/hk-spam-day10-email-mpc-7448.md.
# It runs on the */5 trigger at 01:00-04:00 UTC (09:00 HKT first run, hourly retries), see isHkSpamSlot in lib/hkSpam.js; no separate cron (Workers Free allows 5 per account).
HK_SPAM_ENABLED = "true"
# MPC-7545: LIVE from this change. Chris gave the launch word for real HK day-10 emails on 2026-10-26 (wording approved, MPC-7385 scan go-live Done).
# Rollback: set "false" (test mode) or HK_SPAM_ENABLED = "false" and merge, or Actions -> Rollback Worker -> mpt-scan-report. Sends already made cannot be undone.
HK_SPAM_EMAILS_LIVE = "true"

# MPC-9890: a free user's record is deleted 7 days after the report is delivered (Open Tracker, Chris 2026-11-08): countdown emails at T-24 h and T-4 h, a "done" email at T-0,
# one-click Keep (/api/keep), HubSpot contact deleted. The deadline and the deletion are in Supabase (migration 20261108210000). Anything but "true" runs none of it from this
# Worker (the hourly pg_cron backstop in the migration still deletes records more than an hour overdue). Rollback: "false" and merge.
FREE_RECORD_DELETION_ENABLED = "true"

# MPC-8452 Tier 2: search public GitHub commits for the visitor's address. This is the only check that sends the PLAIN address to a third party. ON since
# 2026-10-26 on the owner's instruction, after the Privacy page sentence for it went live (PR 528). Only the exact string "true" runs it; "false" is the rollback.
# Set the Worker secret GITHUB_SEARCH_TOKEN (a GitHub token with no scopes) because the unauthenticated search allows about 10 requests a minute. See docs/osint-list-mpc-8452.md.
EMAIL_GITHUB_COMMITS_ENABLED = "true"

# MPC-7465/7470: save the visitor's scan with the email request (POST /api/scan with scan + save_consent:true, the separate tick box at the contact step).
# ON since 2026-10-12 (MPC-7470: wording approved by Chris, decision D12, production migrations applied). Anything but "true" saves nothing, so "false" is the rollback.
# The site has a matching flag, VITE_SAVE_WEB_SCANS (a Cloudflare Pages build variable): the tick box only shows when BOTH are on.
WEB_SCAN_SAVE_ENABLED = "true"

# MPC-7471-F3: the post-scan popup sends a per-submit request_id so a retry after a lost answer gets the original outcome (and scan number) back instead of "already
# requested". Reads and writes scans.request_id: migration 20261026200000_mpc_7471_f3_scans_request_id.sql was applied to production on 2026-10-27 (approved in the
# MPC-7471-F3 session). ON since that date. Anything but "true" ignores request_id and never touches the column, so "false" is the rollback.
REPORT_REQUEST_ID_ENABLED = "true"

# MPC-7494: the open mirror ("Welcome back, we recognised your device without a cookie"). ON since 2026-10-12 on Chris's instruction, after he approved the
# screen, the threshold and the exact opt-in wording, and after the recognise-opt-in migration (20261012240000) was applied. Recognition runs only for a browser
# holding a scan saved with BOTH the save consent and the separate "recognise this device" consent. Needs WEB_SCAN_SAVE_ENABLED too. "false" is the rollback;
# anything but "true" does nothing.
RECOGNITION_ENABLED = "true"

# MPC-7645 ON 2026-10-14 IN TESTER MODE: the Worker secret REFERRALS_TEST_RECIPIENTS limits every referral feature to the listed test addresses. Deleting that secret opens the programme to ALL users. Rollback: "false".
# MPC-7645: referral programme ("Invite 3 friends", one free month of Pro per friend who gets a report). OFF. Turn on only after Chris has approved the
# email copy (lib/referralEmail.js) and the Privacy text, and migration 20261013100000_mpc_7645_referrals.sql is applied. Needs UNSUBSCRIBE_SECRET.
# The site has a matching flag, VITE_REFERRALS_ENABLED. Anything but "true" does nothing: no link, no block in the report, no reward, endpoints answer 404.
REFERRALS_ENABLED = "true"

# MPC-9546/9549: Deep Research ownership check + own results list (lib/deepResearch.js, routes /api/deep-research/{start,verify,results,delete}).
# ON since 2026-11-07 on Chris's instruction ("switch it on now"). Anything but the exact string "true" does nothing: all four routes answer 404.
# Needs the Worker SECRET DEEP_RESEARCH_HMAC_KEY (set 2026-11-07; without it the routes answer 503). The site has a matching flag, VITE_DEEP_RESEARCH (a Cloudflare Pages
# build variable): the form only shows when BOTH are on. Retention is 90 days (Chris, 2026-11-07).
# Rollback: set "false" and merge (routes 404 again). Codes already sent cannot be recalled; they expire in 10 minutes.
DEEP_RESEARCH_ENABLED = "true"
# Tester mode: set the Worker SECRET REFERRALS_TEST_RECIPIENTS (comma separated addresses, `wrangler secret put`, never in this file) to limit the programme to
# those addresses while it is tested: the invite block, invite page, invitations (to listed addresses only) and reward emails. Everyone else is unchanged.
# Delete the secret to open the programme to every user. Order matters: set the secret BEFORE setting REFERRALS_ENABLED = "true".

# MPC-7645 A/B tests across the referral funnel, both OFF (anything but "true" = everyone gets the control and nothing is recorded). Copy needs Chris's approval before either goes on.
#  REFERRAL_AB_REPORT_BLOCK   wording of the invite block in the report email (control / friend_first), stored in users.referral_block_variant
#  REFERRAL_AB_INVITE_SUBJECT subject line of the invitation to the friend (control / specific_subject), stored in referrals.invite_variant
# The site has a third, in-browser test (VITE_AB_REFERRAL_INVITE_LAYOUT_ENABLED). Reading results: docs/ab-testing.md.
REFERRAL_AB_REPORT_BLOCK = "false"
REFERRAL_AB_INVITE_SUBJECT = "false"

# MPC-8430: Cloudflare Turnstile on POST /api/scan. Needs the Worker secret TURNSTILE_SECRET_KEY (the widget created for this Worker; no secret = off).
# TURNSTILE_ENFORCE "false" = report-only: a missing/invalid token is logged (TURNSTILE_FAILED, truncated IP) but the request goes through.
# "true" = a failed check answers 403 and nothing is stored or sent. Rollback: set back to "false" and redeploy.
TURNSTILE_ENFORCE = "true"

# MPC-7554: follow-ups chosen by what was found for each report, for every user (not only the first 100), and the "I have fixed this" link. OFF until Chris approves the copy and
# migration 20261028150000_mpc_7554_followup_state.sql (scans.fixed_at, scans.followup_ended) is applied. Anything but "true" keeps the earlier calendar follow-ups. Rollback: "false".
FOLLOWUP_STATE_ENABLED = "false"

# MPC-8453: refuse an address whose domain does not exist or accepts no mail (DNS check, domain only, fails open). "false" = rollback.
EMAIL_DOMAIN_CHECK = "true"

# Secrets (wrangler secret put NAME, never in repo/chat): see EXPECTED_SECRETS.txt

# MPC-9813 (F1 broker lookup, Chris Decision 7, 2026-11-07). Both need migration 20261107140000_mpc_9813_confirm_gate_and_listing_check.sql (applied on merge by deploy-supabase.yml).
#  EMAIL_CONFIRM_GATE_ENABLED  "true": a new scan waits for the click-to-confirm in the confirmation email. No report is sent and no check that uses details about
#                              the person runs before it. Scans created before this switch are unaffected. Fails closed: if a scan cannot be marked as waiting, the request fails.
#  LISTING_CHECK_ENABLED       "true" (needs the gate): the optional name / place / phone / up to 3 "page that lists you" addresses are accepted with a saved scan, stored with it
#                              (same 12-month retention and scan-number deletion), and the pages are read after the click. No broker site is ever searched.
# Anything but the exact string "true" is off. Rollback: set "false" and redeploy (scans already marked keep waiting only while the gate is on).
EMAIL_CONFIRM_GATE_ENABLED = "true"
LISTING_CHECK_ENABLED = "true"

# MPC-9817 (F3, accounts and sign-in only): passwordless accounts through Supabase Auth, driven from this Worker (lib/accounts.js): POST /api/account/{signin,verify,me,scan,
# link-scan,delete,refresh,signout,can}. The sign-in email is ours (confirm-gate style); the browser never talks to Supabase Auth. The one-step tick ("Keep my scan and create
# my free account", consent version 2026-11-08-v1) is acted on at the click-to-confirm. Needs migration 20261108120000_mpc_9817_accounts_and_signin.sql (applied before this
# was switched on). Anything but the exact string "true" is off and every route answers 404; "false" is the rollback (existing accounts are untouched). No Stripe, no allowances.
ACCOUNTS_ENABLED = "true"

# MPC-9887: the server-side consent gate. POST /api/consent stores one consent per scan id (public.scan_consents, migration 20261108150000_mpc_9887_scan_consents.sql,
# applied before this was merged). A consent_id sent with POST /api/scan is always checked against the store. "false" = a scan WITHOUT a consent id is still accepted,
# because no visitor holds one until the consent block (MPC-9888) ships; MPC-9888 sets this to "true" in the same change, after the report queue has drained.
# Only the exact string "true" enforces. When it is "true", every post_click call made for a scan is refused (CONSENT_REQUIRED / CONSENT_INVALID) unless the scan's consent is in the store.
# MPC-9888: scans created before this moment were requested before the consent block existed and are finished on the old rules.
CONSENT_GATE_SINCE = "2026-11-14T06:30:00Z"
CONSENT_GATE_ENFORCED = "true"   # MPC-9888: on with the consent block; the report queue was checked for scans without a consent id first

# MPC-9818 (F3): monthly scan allowances per plan, decided by Chris 2026-11-07: Free 1 / Basic 5 / Pro 25 / Executive unlimited (no cap, no fair-use text). POST /api/scan counts the scan
# against the plan that owns the confirmed address (an account's plan, otherwise Free) BEFORE anything is saved or sent, and a refused request creates and sends nothing (HTTP 429, code
# scan_allowance_exhausted, with an honest message that says when the allowance resets and what the next plan includes). The numbers and the 20 entitlement rows live in the database
# (public.plan_scan_allowance, public.capability_min_tier), not here. Needs migration 20261108140000_mpc_9818_entitlements_and_scan_allowances.sql (applied before this was switched on).
# Anything but the exact string "true" is off; "false" + redeploy is the rollback (counted rows stay, nothing is refused). While the function is missing (HTTP 404) nothing is enforced.
SCAN_ALLOWANCE_ENABLED = "true"
# MPC-9816: a Free address never triggers the breach lookup (third-party cost): the breach section is NOT CHECKED. "false" + redeploy is the rollback.
BREACH_GATE_ENABLED = "true"

[observability]
enabled = true

# MPC-7350: per-IP rate limit on POST /api/scan (5 requests / 60s). Code fails open if the binding is missing.
# Syntax: [[unsafe.bindings]] because wrangler 3.90.0 (installed by the deploy action) ignores [[ratelimits]].
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "7351"
simple = { limit = 5, period = 60 }

# MPC-8452: per-IP limit on the live view (GET /api/scan/live, polled every few seconds): 40 requests / 60s. Fails open if the binding is missing.
[[unsafe.bindings]]
name = "LIVE_LIMITER"
type = "ratelimit"
namespace_id = "7352"
simple = { limit = 40, period = 60 }
