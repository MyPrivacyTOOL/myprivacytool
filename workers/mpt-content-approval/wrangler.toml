# mpt-content-approval: POST /approve. Handles the Slack buttons (Approve All / Reject / Edit & Resubmit) and the JSON form
# { action, drafted_content_id, timestamp }. On approve it hands the drafts to the Make.com webhook.
# MyPrivacyTOOL Cloudflare account 35cb17172c65a20f5cf1baf131485382.
# URL: https://mpt-content-approval.myprivacytool.workers.dev/approve  (use this as the Slack app's Interactivity Request URL).
# No zone route: api.myprivacytool.io is a custom domain owned by mpt-leads, and a Worker can't also route a path on it without
# replacing that custom domain with routes (see the Cloudflare audit page, section 6).
name = "mpt-content-approval"
main = "worker.js"
workers_dev = true
compatibility_date = "2024-09-23"

[observability]
enabled = true

[[kv_namespaces]]
binding = "PUBLISHED_POSTS"
id = "2c58243307124e74b9bee12093d4c081"  # mpt-published-posts (MPC-8371)

[[d1_databases]]
binding = "AGENT_LOGS"
database_name = "mpt-agent-logs"
database_id = "b9dc1a03-74be-45a0-85db-fb61d80825ac"

# Secrets are NOT declared here. Expected names: EXPECTED_SECRETS.txt
# MAKE_WEBHOOK_URL is the full Make.com hook URL (its token is the credential; never commit it). Optional: MAKE_API_KEY, sent as x-make-apikey.
# Every Make POST is logged to D1 make_webhook_log (apply workers/mpt-content-consumer/migrations/0003_make_webhook_log.sql first).
[vars]
SLACK_APPROVER = "chris"
# Default asset: the brand OG image, until the per-post asset pipeline (MPC-8366) exists. asset_url is required by the Make.com schema, so approvals fail without it.
DEFAULT_ASSET_URL = "https://www.myprivacytool.io/og-image.jpg"
# LinkedIn thumbnail (MPC-8366 image route): R2 key in mpt-brand-assets, e.g. "social/mpt-yt-still06-brand-end-card.png".
# Unset on purpose until that object is confirmed to exist in R2: Make fetches it for every LinkedIn post, so a wrong key fails the post.
# DEFAULT_IMAGE_KEY = "social/mpt-yt-still06-brand-end-card.png"
