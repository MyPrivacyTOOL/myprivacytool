name = "myprivacytool-webhook-receiver"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ─── ROUTES ──────────────────────────────────────────────────────────────────
# Uncomment and set your domain once Cloudflare Pages is live
# routes = [
#   { pattern = "myprivacytool.io/webhook/*", zone_name = "myprivacytool.io" }
# ]

# ─── SCHEDULED JOBS ──────────────────────────────────────────────────────────
# Purge of expired rows in the Notion "MPT OSINT Scan Results" DB (MPC-6957).
# Rows carry a 24h TTL via `Expires At`; Notion cannot expire rows itself.
# Runs hourly so rows are archived within ~1h of expiry. See docs/osint-scan-purge.md
[triggers]
crons = ["0 * * * *"]

# ─── SECRETS ─────────────────────────────────────────────────────────────────
# All secrets are set via `wrangler secret put VARNAME`.
# Purge job also needs: NOTION_TOKEN, TELEGRAM_BOT_KEY, TELEGRAM_ALERT_CHAT_ID
# See DEPLOYMENT.md for the full list and descriptions.
# Never hardcode values in this file.

# ─── OBSERVABILITY ───────────────────────────────────────────────────────────
[observability]
enabled = true

# ─── ENVIRONMENTS ────────────────────────────────────────────────────────────
[env.production]
name = "myprivacytool-webhook-receiver"

[env.staging]
name = "myprivacytool-webhook-receiver-staging"
