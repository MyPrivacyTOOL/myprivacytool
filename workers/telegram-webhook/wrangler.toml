name = "mpt-telegram-webhook"
main = "index.js"
compatibility_date = "2024-01-01"

# KV namespace MPT_KV (MPT Cloudflare account, created 2026-10-07). Stores per-chat conversation state.
[[kv_namespaces]]
binding = "MPT_KV"
id = "7471214ae91d4bbebfceefd5bfefc03f"

# Environment variables — set in Cloudflare Dashboard (not committed to git)
# TELEGRAM_BOT_TOKEN
# HUBSPOT_API_KEY
# WEBHOOK_SECRET

[env.production]
name = "mpt-telegram-webhook-prod"
