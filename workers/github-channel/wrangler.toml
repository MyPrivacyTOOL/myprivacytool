name = "myprivacytool-github-channel"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = false   # the old *.workers.dev address is retired; the Worker is served from channels.myprivacytool.io only

# Served from a subdomain of the site so the session cookie is same-site (Safari/Firefox block third-party cookies).
# `wrangler deploy` creates the DNS record and certificate for a custom_domain route automatically.
routes = [{ pattern = "channels.myprivacytool.io", custom_domain = true }]

# MPC-115 Phase 1 channel integration: GitHub OAuth (auth code + PKCE) -> encrypted token in Supabase
# -> PaPIT v1 profile, cached 24h in Workers KV.
#
# Secrets are NOT declared here (set with `wrangler secret put`, names in EXPECTED_SECRETS.txt).
# Non-secret settings below are declared on purpose: `wrangler deploy` replaces dashboard plain-text
# variables with this file. Placeholder values must be replaced before a real deploy.
[vars]
GITHUB_CLIENT_ID = "Ov23liPwVZAmOuXl12Aq"
REDIRECT_URI = "https://channels.myprivacytool.io/oauth/github/callback"   # must equal the GitHub OAuth app callback URL
SUPABASE_URL = "https://xmdmkumwxpgahmlweuug.supabase.co"
ALLOWED_ORIGIN = "https://www.myprivacytool.io,https://myprivacytool.io"  # SPA origins (comma-separated): CORS + CSRF check
SUCCESS_REDIRECT = "https://www.myprivacytool.io/connect/github"  # where the callback sends the browser
ENCRYPTION_KEY_VERSION = "1"                       # version that new tokens are encrypted with

# 24h profile cache (MPC-115 decision C). Create with: wrangler kv namespace create PROFILE_CACHE
[[kv_namespaces]]
binding = "PROFILE_CACHE"
id = "422aa105e9264b1ebb354e500454ade9"

[observability]
enabled = true
