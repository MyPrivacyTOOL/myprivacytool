# mpt-cairn-blackboard: API bridge for the Cairn OSINT blackboard (MPC-8413 step 2, spec MPC-8401).
# MyPrivacyTOOL Cloudflare account 35cb17172c65a20f5cf1baf131485382.
name = "mpt-cairn-blackboard"
main = "worker.js"
workers_dev = true
compatibility_date = "2024-09-23"

[observability]
enabled = true

# Secrets are NOT declared here (values live in Cloudflare; `wrangler deploy` leaves them alone).
# Expected names: EXPECTED_SECRETS.txt (the deploy workflow fails if any goes missing).
#
# Optional plain variable (not a secret): HASH_FACT_TYPES, comma-separated fact types hashed before storage. Default "phone".
