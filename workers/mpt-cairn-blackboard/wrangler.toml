# mpt-cairn-blackboard: API bridge for the Cairn OSINT blackboard (MPC-8413 step 2, spec MPC-8401) and its Supabase -> Notion mirror (step 3).
# MyPrivacyTOOL Cloudflare account 35cb17172c65a20f5cf1baf131485382.
name = "mpt-cairn-blackboard"
main = "worker.js"
workers_dev = true
compatibility_date = "2024-09-23"

[observability]
enabled = true

# Secrets are NOT declared here (values live in Cloudflare; `wrangler deploy` leaves them alone).
# Expected names: EXPECTED_SECRETS.txt (the deploy workflow fails if any goes missing).
#
# Optional plain variable (not a secret): HASH_FACT_TYPES, comma-separated fact types hashed before storage. Default "phone".

# Notion databases the mirror writes to (MPC-8413 step 3), under 14 - Data & Knowledge. These are identifiers, not secrets.
# The NOTION_TOKEN integration must have all three databases shared with it.
[vars]
NOTION_CAIRN_SESSIONS_DB = "318dfa5f-eb62-46fa-9bd0-c9fa58577c65"
NOTION_CAIRN_FACTS_DB = "5aa01b41-879e-43f7-ac77-57bbb9bfcb77"
NOTION_CAIRN_INTENTS_DB = "3cdbc13a-85fe-4fea-b108-bbcf955227e4"
