# mpt-content-consumer: Queue consumer. Reads the day's topic + brand guardrails from KV, drafts 4 posts via 4 concurrent
# Anthropic calls, logs drafts to D1, posts them to Slack #mpt-content-approval with approval buttons.
# MyPrivacyTOOL Cloudflare account 35cb17172c65a20f5cf1baf131485382. Producer: workers/mpt-content-producer. Buttons: workers/mpt-content-approval.
name = "mpt-content-consumer"
main = "worker.js"
workers_dev = true
compatibility_date = "2024-09-23"

[observability]
enabled = true

[[queues.consumers]]
queue = "mpt-content-generation-queue"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

[[kv_namespaces]]
binding = "CONTENT_CACHE"
id = "15f4c0ac614b4c60954dd42e9d8c8ee5"

[[kv_namespaces]]
binding = "PUBLISHED_POSTS"
id = "2c58243307124e74b9bee12093d4c081"  # mpt-published-posts (MPC-8371)

[[d1_databases]]
binding = "AGENT_LOGS"
database_name = "mpt-agent-logs"
database_id = "b9dc1a03-74be-45a0-85db-fb61d80825ac"

# Secrets are NOT declared here. Expected names: EXPECTED_SECRETS.txt
[vars]
# DEVIATION: the spec names claude-3-5-sonnet-20241022, which Anthropic has retired (calls would fail). Set back only if it is still served.
LLM_MODEL = "claude-sonnet-5-5"
SLACK_CHANNEL = "#mpt-content-approval"
