# MPT (MyPrivacyTOOL) social-listeners Worker — MPT-1004. Microdrama: ears on every channel.
name = "social-listeners"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# Secrets are NOT declared here: wrangler.toml cannot hold secret values, and `[vars]` would be plain text.
# They are bound at runtime as `env.<NAME>` after `wrangler secret put <NAME>` (see /SECRETS.md) or after
# the deploy workflow pushes them from GitHub Actions secrets (.github/workflows/deploy.yml).
# Names (also in EXPECTED_SECRETS.txt):
#   SUPABASE_URL, SUPABASE_KEY, TWILIO_SID, TWILIO_AUTH_TOKEN, META_APP_SECRET,
#   X_BEARER_TOKEN + X_USER_ACCESS_TOKEN (MPC-7628 Mirror bot: public profile lookup / DM replies),
#   X_CLIENT_ID + X_CLIENT_SECRET + X_REFRESH_TOKEN (MPC-7628: keep the X user token fresh; the rotating pair is stored in Supabase public.mpt_x_oauth_tokens, X_REFRESH_TOKEN only seeds it),
#   X_CONSUMER_SECRET, LINKEDIN_CLIENT_SECRET, TELEGRAM_WEBHOOK_SECRET, CORE_BRAIN_TOKEN (must equal core-brain's WEBHOOK_SECRET; sent on every forward),
#   TELEGRAM_BOT_TOKEN (BotFather token; sends the reply core-brain chose. Without it Telegram messages are ingested but not answered)

# Channel probe reader (test-only, docs/channel-probe.md): plain vars, NOT secrets. Both unset = off. PROBE_MODE="on" plus
# PROBE_TELEGRAM_IDS="<our test account ids>" saves raw payloads and public-lookup results for those accounts only (7 day expiry).
# Set them in the Cloudflare dashboard (Worker > Settings > Variables) or `wrangler deploy --var PROBE_MODE:on`; never commit real ids.

[observability]
enabled = true

# MPC-8301: inbound webhook routes, served by src/index.ts:
#   /webhook/x         -> src/x-webhook.ts        (CRC GET + signed POST)
#   /webhook/telegram  -> src/telegram-webhook.ts (secret-token POST)
#   /webhook/linkedin  -> src/linkedin-webhook.ts (MPC-7640: challenge GET + X-LI-Signature POST)
# Both forward verified payloads to core-brain (MPC-8601) at POST /ingest/social with `Authorization: Bearer CORE_BRAIN_TOKEN`.
[[services]]
binding = "CORE_BRAIN"
service = "core-brain"

# HTTP fallback instead of the service binding: remove [[services]] above and set CORE_BRAIN_URL here.
# [vars]
# CORE_BRAIN_URL = "https://core-brain.<account>.workers.dev"

# MPC-7628: Mirror bot limits (every scan spends X API credits). Same syntax as core-brain/mpt-leads: the deploy action's wrangler 3.90.0
# ignores the newer [[ratelimits]] table, so this must be [[unsafe.bindings]] type = "ratelimit" (a test pins it). Per sender: 3
# Mirror commands / 60 s; global backstop 30 / 60 s. Over the limit the DM is dropped without a reply. Fails open if unbound.
# namespace_id values are account-unique integers (core-brain 8601/8602, mpt-leads 7350, scan-report 7351).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "7628"
simple = { limit = 3, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMITER_GLOBAL"
type = "ratelimit"
namespace_id = "7629"
simple = { limit = 30, period = 60 }
