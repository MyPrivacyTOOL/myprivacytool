# mpt-mirror-risk — Mirror & Risk API (MPC-7252). MyPrivacyTOOL Cloudflare account.
# NOT deployed by any workflow yet: the owner adds a deploy workflow (see README.md) once the HIBP key is set.
name = "mpt-mirror-risk"
main = "worker.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# No breach provider is configured on purpose (MPC-7252): with none, every email lookup returns
# status "not_checked" and the Worker calls no third party.
#   - XposedOrNot free API: terms (s.4) require a licensing agreement for commercial use, and s.5 requires
#     attribution. Do NOT set BREACH_PROVIDER = "xposedornot" unless the owner has written permission.
#   - HIBP (paid): set BREACH_PROVIDER = "hibp" and `wrangler secret put HIBP_API_KEY` in Phase 5 (revenue).

[observability]
enabled = true

# Per-IP rate limit (same pattern as mpt-scan-report). Code fails open if the binding is missing.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "7252001"
simple = { limit = 10, period = 60 }

# Secrets are not declared here. Expected names: EXPECTED_SECRETS.txt
