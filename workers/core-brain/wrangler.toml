name = \"mpt-core-brain\"\nmain = \"index.js\"\ncompatibility_date = \"2024-01-15\"\n\n# Type of Worker deployment\ntype = \"service\"\n\n# Environment variables (reference only — set in Cloudflare Dashboard)\n# DO NOT commit secret values to git. Use Dashboard → Settings → Variables\n#\n# Required:\n#   SUPABASE_URL — https://your-project.supabase.co\n#   SUPABASE_SERVICE_KEY — (service role key, NOT anon public key)\n#   QWEN_API_KEY — Alibaba Cloud API key\n#   QWEN_MODEL — qwen-7b-chat or qwen-turbo\n#   WEBHOOK_SECRET — Shared secret for webhook authentication\n#\n# Optional (if routing responses directly from Worker):\n#   X_API_KEY — X/Twitter Bearer token for DM sending\n#   TELEGRAM_BOT_TOKEN — Telegram bot token\n#\n# Optional (for delegated intent/risk):\n#   MIRROR_AND_RISK_WORKER_URL — URL to MPC-8302 Worker\n\n# KV Namespace binding for rate limiting & session state\n[[kv_namespaces]]\nbinding = \"CORE_BRAIN_KV\"\nid = \"REPLACE_WITH_KV_NAMESPACE_ID\"\npreview_id = \"REPLACE_WITH_KV_PREVIEW_ID\"\n\n# Analytics Engine binding (optional — for metrics export to Cloudflare Analytics)\n[[analytics_engine_bindings]]\nbinding = \"ANALYTICS\"\n\n# Routes: specify Worker URL patterns\nroutes = [\n  { pattern = \"mpt-core-brain.*.workers.dev\", zone_name = \"workers.dev\" }\n]\n\n# Build configuration\n[build]\ncommand = \"npm install\"\ncwd = \".\"\n\n[build.upload]\nformat = \"modules\"\nmain = \"index.js\"\n\n# Observability (optional)\n[observability]\nenabled = true\n\n# Production environment\n[env.production]\nname = \"mpt-core-brain-prod\"\nvars = { ENVIRONMENT = \"production\", LOG_LEVEL = \"info\" }\n\n# Staging environment (for testing)\n[env.staging]\nname = \"mpt-core-brain-staging\"\nvars = { ENVIRONMENT = \"staging\", LOG_LEVEL = \"debug\" }\n\n# Development environment (local testing)\n[env.development]\nname = \"mpt-core-brain-dev\"\nvars = { ENVIRONMENT = \"development\", LOG_LEVEL = \"debug\" }\n"