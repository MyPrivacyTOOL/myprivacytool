# MPT (MyPrivacyTOOL) core-brain: orchestrator worker (MPT-1002, FLEET-TASK-V4.2).
name = "mpt-core-brain"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]   # twilio + supabase-js expect Node built-ins
workers_dev = true

[vars]
ENVIRONMENT = "development"
QWEN_BASE_URL = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"   # Qwen via OpenAI-compatible API
QWEN_MODEL = "qwen-plus"

# Microdrama: core-brain calls social-listeners directly (no public hop).
# Resolves in `wrangler dev` only when both workers run in one session; see README.
[[services]]
binding = "SOCIAL_LISTENERS"
service = "mpt-social-listeners"

# Secrets are NOT declared here: `wrangler secret put <NAME>` (names in EXPECTED_SECRETS.txt).

[observability]
enabled = true
