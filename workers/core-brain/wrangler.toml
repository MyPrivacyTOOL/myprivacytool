name = "mpt-core-brain"
main = "index.js"
compatibility_date = "2024-01-01"

# Environment variables — set in Cloudflare Dashboard (not committed to git)
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# QWEN_API_KEY
# QWEN_MODEL (e.g., qwen-7b-chat or qwen-turbo)
# X_API_KEY (optional, if using X API directly)
# TELEGRAM_BOT_TOKEN (optional, if routing Telegram responses)
# WEBHOOK_SECRET (for verifying inbound payloads)

# KV namespace for rate limiting and session state
[[kv_namespaces]]
binding = "CORE_BRAIN_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[env.production]
name = "mpt-core-brain-prod"
